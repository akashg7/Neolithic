# Certificate present for __DOMAIN__: HTTPS, with HTTP redirecting to it.
server {
    listen 80 default_server;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # Container healthcheck and load balancers probe plain HTTP.
    location = /health { proxy_pass http://backend; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/km/site.conf;
}
