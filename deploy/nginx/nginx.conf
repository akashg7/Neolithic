# Main config. The server blocks are chosen at container start by
# 40-krishimitr.sh: plain HTTP until a certificate exists for $DOMAIN, then
# HTTPS (with HTTP redirecting to it). Browsers only allow the microphone on
# HTTPS, so voice input needs the second mode.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Docker's embedded DNS, so a recreated api container is re-resolved
    # without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 1m;
        server api:8000 max_fails=3 fail_timeout=5s resolve;
        keepalive 32;
    }

    # Gzip — slow rural connections.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    include /etc/nginx/km-active/servers.conf;
}
