# One origin for everything:
#   /            → the web app (static, SPA fallback to index.html)
#   /api/, /health, /docs, /openapi.json → FastAPI (api:8000)
# TLS: put the instance behind a load balancer / Cloudflare, or add a 443
# server block with certbot certificates here.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Docker's embedded DNS, so a recreated api container is re-resolved
    # without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 64k;
        server api:8000 max_fails=3 fail_timeout=5s resolve;
        keepalive 32;
    }

    # Gzip — slow rural connections.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        client_max_body_size 50M;   # photos, audio clips

        root /usr/share/nginx/html;

        location ~ ^/(api/|health$|docs|redoc|openapi\.json) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;    # Sarvam STT/TTS, forecasts
            proxy_send_timeout 120s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # Hashed bundles/images: cache hard. index.html: never.
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|mp3|wav)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /video { try_files /video.html =404; }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
