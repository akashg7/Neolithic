name: Deploy to EC2

# Pushing to `main` or `integrated` deploys that branch to the EC2 host.
# "Run workflow" in the Actions tab deploys any branch, optionally reseeding.
#
# Repository secrets:
#   EC2_HOST      public IP / DNS of the instance
#   EC2_USER      ssh user (ubuntu / ec2-user)
#   EC2_SSH_KEY   private key for that user
#   EC2_APP_DIR   (optional) checkout path on the server, default ~/Neolithic
#   EC2_ENV_FILE  (optional) full path of the env file on the server. If it's
#                 not set, deploy.sh looks in <app dir>/.env, then the parent
#                 folder's .env, then ~/.env
#
# The server needs: Docker + compose plugin and a filled-in env file
# (never committed). Code is fetched with the job token, no deploy key. The workflow
# never writes secrets to the server; .env is managed there by hand.

on:
  push:
    branches: [main, integrated]
  workflow_dispatch:
    inputs:
      reseed:
        description: "Reset data to the demo story (also refreshes price dates)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # DB-free suites that guard the integration contract.
      - run: python -m pytest -q tests/agent_tools tests/test_offers_escrow_fsm.py tests/test_member_5_ai_voice.py
        env:
          JWT_SECRET: ci-only-secret

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.ref_name }}
          RESEED: ${{ inputs.reseed && '--reseed' || '' }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
          REPO: ${{ github.repository }}
          # Short-lived (job-scoped) token so the server can fetch the repo
          # without a deploy key. Used only on the fetch command line, never
          # written into the server's git config.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BRANCH,RESEED,APP_DIR,ENV_FILE,REPO,GH_TOKEN
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-$HOME/Neolithic}"
            URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              git init -q "$APP_DIR"
              git -C "$APP_DIR" remote add origin "https://github.com/${REPO}.git"
            fi
            cd "$APP_DIR"
            git fetch --prune "$URL" "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            chmod +x deploy/deploy.sh
            ENV_FILE="${ENV_FILE:-}" ./deploy/deploy.sh $RESEED
            docker image prune -f >/dev/null
